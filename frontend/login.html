<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NomNom — Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:    #E8280B;
      --orange: #FF6B2B;
      --amber:  #FFAD42;
      --dark:   #0F0A07;
      --dark2:  #1A1108;
      --cream:  #FFF8F0;
      --muted:  #9E8B7A;
      --card:   #1E1510;
      --input:  #261A12;
      --border: rgba(255,255,255,0.08);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--dark);
      color: var(--cream);
      min-height: 100vh;
      display: flex;
    }

    /* ── LEFT PANEL ── */
    .left-panel {
      width: 45%;
      background: var(--dark2);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2.5rem;
    }

    @media (max-width: 768px) { .left-panel { display: none; } }

    .left-bg {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 30% 40%, rgba(255,107,43,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 80% 80%, rgba(232,40,11,0.12) 0%, transparent 60%);
    }

    .left-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,107,43,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,107,43,0.06) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    .left-content {
      position: relative; z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2rem;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800; font-size: 1.6rem;
      color: var(--cream);
      text-decoration: none;
      letter-spacing: -0.03em;
      position: relative; z-index: 2;
    }
    .logo span { color: var(--orange); }

    .left-headline {
      font-family: 'Syne', sans-serif;
      font-size: 2.6rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .left-headline .accent {
      background: linear-gradient(135deg, var(--orange), var(--amber));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .left-sub {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.7;
      font-weight: 300;
    }

    .food-cards {
      display: flex; gap: 1rem; flex-wrap: wrap;
    }

    .food-chip {
      background: rgba(255,107,43,0.1);
      border: 1px solid rgba(255,107,43,0.2);
      border-radius: 100px;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      display: flex; align-items: center; gap: 0.4rem;
      animation: float 3s ease-in-out infinite;
    }
    .food-chip:nth-child(2) { animation-delay: 0.5s; }
    .food-chip:nth-child(3) { animation-delay: 1s; }
    .food-chip:nth-child(4) { animation-delay: 1.5s; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .left-footer {
      position: relative; z-index: 2;
      color: var(--muted); font-size: 0.8rem;
    }

    /* ── RIGHT PANEL ── */
    .right-panel {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .form-box {
      width: 100%;
      max-width: 420px;
      animation: fadeUp 0.5s ease both;
    }

    .form-box .mobile-logo {
      display: none;
      font-family: 'Syne', sans-serif;
      font-weight: 800; font-size: 1.5rem;
      color: var(--cream);
      text-decoration: none;
      margin-bottom: 2rem;
    }
    .form-box .mobile-logo span { color: var(--orange); }

    @media (max-width: 768px) {
      .form-box .mobile-logo { display: block; }
    }

    .form-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.4rem;
    }

    .form-sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    .form-sub a { color: var(--orange); text-decoration: none; }
    .form-sub a:hover { text-decoration: underline; }

    .form-group { margin-bottom: 1.2rem; }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 0.4rem;
      letter-spacing: 0.02em;
    }

    input {
      width: 100%;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.85rem 1rem;
      color: var(--cream);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input::placeholder { color: rgba(255,255,255,0.2); }
    input:focus {
      border-color: rgba(255,107,43,0.5);
      box-shadow: 0 0 0 3px rgba(255,107,43,0.08);
    }

    .input-wrap {
      position: relative;
    }
    .input-wrap input { padding-right: 3rem; }
    .toggle-pw {
      position: absolute; right: 1rem; top: 50%;
      transform: translateY(-50%);
      cursor: pointer; font-size: 1.1rem;
      color: var(--muted);
      user-select: none;
    }

    .form-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .remember {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.85rem; color: var(--muted);
      cursor: pointer;
    }
    .remember input[type="checkbox"] {
      width: 16px; height: 16px;
      accent-color: var(--orange);
    }

    .forgot { color: var(--orange); font-size: 0.85rem; text-decoration: none; }
    .forgot:hover { text-decoration: underline; }

    .btn-submit {
      width: 100%;
      padding: 0.95rem;
      background: linear-gradient(135deg, var(--red), var(--orange));
      border: none;
      border-radius: 0.75rem;
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 4px 20px rgba(232,40,11,0.3);
      letter-spacing: 0.01em;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(232,40,11,0.45);
    }
    .btn-submit:active { transform: translateY(0); }

    .divider {
      display: flex; align-items: center; gap: 1rem;
      margin: 1.5rem 0;
      color: var(--muted); font-size: 0.8rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .register-link {
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .register-link a {
      color: var(--orange);
      text-decoration: none;
      font-weight: 500;
    }
    .register-link a:hover { text-decoration: underline; }

    /* Alert */
    .alert {
      padding: 0.85rem 1rem;
      border-radius: 0.75rem;
      font-size: 0.88rem;
      margin-bottom: 1.2rem;
      display: none;
    }
    .alert-error {
      background: rgba(232,40,11,0.1);
      border: 1px solid rgba(232,40,11,0.3);
      color: #ff6b6b;
    }
    .alert-success {
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.3);
      color: #4ade80;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div class="left-bg"></div>
    <div class="left-grid"></div>

    <a href="index.html" class="logo">Nom<span>Nom</span></a>

    <div class="left-content">
      <div class="left-headline">
        Welcome<br>back to<br><span class="accent">NomNom.</span>
      </div>
      <p class="left-sub">
        Your favorite food is just a few clicks away.
        Sign in and let's get you fed.
      </p>
      <div class="food-cards">
        <div class="food-chip">🍔 Burgers</div>
        <div class="food-chip">🍕 Pizza</div>
        <div class="food-chip">🧋 Drinks</div>
        <div class="food-chip">🍜 Noodles</div>
      </div>
    </div>

    <div class="left-footer">© 2026 NomNom</div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <div class="form-box">
      <a href="index.html" class="mobile-logo">Nom<span>Nom</span></a>

      <div class="form-title">Sign in</div>
      <p class="form-sub">Don't have an account? <a href="register.html">Create one →</a></p>

      <div class="alert alert-error" id="alertError"></div>
      <div class="alert alert-success" id="alertSuccess"></div>

      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@email.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
          <span class="toggle-pw" id="togglePw">👁</span>
        </div>
      </div>

      <div class="form-row">
        <label class="remember">
          <input type="checkbox" id="remember"> Remember me
        </label>
        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <button class="btn-submit" id="loginBtn">Sign in →</button>

      <div class="divider">or</div>

      <div class="register-link">
        New to NomNom? <a href="register.html">Create an account</a>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../config/api.js"></script>
  <script>
    // Toggle password visibility
    $('#togglePw').on('click', function () {
      const pw = $('#password');
      const isText = pw.attr('type') === 'text';
      pw.attr('type', isText ? 'password' : 'text');
      $(this).text(isText ? '👁' : '🙈');
    });

    // Login
    $('#loginBtn').on('click', function () {
      const email = $('#email').val().trim();
      const password = $('#password').val().trim();

      $('#alertError, #alertSuccess').hide();

      if (!email || !password) {
        $('#alertError').text('Please fill in all fields.').show();
        return;
      }

      const btn = $(this);
      btn.text('Signing in...').prop('disabled', true);

      $.ajax({
        url: API_BASE_URL + '/auth/login.php',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ email, password }),
        dataType: 'json',
        success: function (res) {
          if (res.success) {
            localStorage.setItem('nomnom_token', res.token);
            localStorage.setItem('nomnom_user', JSON.stringify(res.user));
            $('#alertSuccess').text('Login successful! Redirecting...').show();

            // Redirect based on role
            const role = res.user.role;
            setTimeout(() => {
              if (role === 'admin')    window.location.href = '../admin/dashboard.html';
              else if (role === 'vendor') window.location.href = '../vendor/dashboard.html';
              else if (role === 'staff')  window.location.href = '../staff/dashboard.html';
              else window.location.href = '../customer/home.html';
            }, 800);
          } else {
            $('#alertError').text(res.message || 'Invalid credentials.').show();
            btn.text('Sign in →').prop('disabled', false);
          }
        },
        error: function () {
          $('#alertError').text('Something went wrong. Please try again.').show();
          btn.text('Sign in →').prop('disabled', false);
        }
      });
    });

    // Enter key
    $(document).on('keydown', function (e) {
      if (e.key === 'Enter') $('#loginBtn').click();
    });
  </script>
</body>
</html>
